name: Package exact TFE Co-op Milestone 4.2.2 source

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TFE_SHA: 54eab324e9b265c503b51c3690f030f42a0f9fcc
  M417_B64_SHA256: f2a7eec673a104572bc8d5f70aabdf872b4581a36c5b89ddd8688e810b12d458
  M417_XZ_SHA256: 95995772a116923b9c26773c1a97468ce931f6b9240a3a3a21bd8ef7283c11dd
  M417_PATCH_SHA256: 930647d0fd18912203c0dda3b028f950134830e84925c01700c65f48d40e41c0
  M418_B64_SHA256: 89a777082a42c8d1881dda2148025d37129bebf0b2030f2159c576fc02c78bf6
  M418_XZ_SHA256: 938d3cb1441f33b71b297c50d7a2bfdc14dc1b9a67c99f086ea43d79fee3db1f
  M418_PATCH_SHA256: 788da95b1e4310ce270fd0553b02fb9e14e5b6668c40764b5dd4bff03fe434ae
  M419_B64_SHA256: 3bfbecf0a4883fa44f64823dcb86eadfc8299c2b6b5523aa00e313ad0c459b0a
  M419_XZ_SHA256: ddeb4959895c7dc722e07aca889930227371b6e077647a2c0c286a076a8a0652
  M419_PATCH_SHA256: f6302f64d6d62800bdba755d69e892c089c03a166d5809d2634361ef32bc3466
  M420_B64_SHA256: cbe74d71c22f3baedf831fb15257da66d08757ce5121a26595581d76ceaed440
  M420_XZ_SHA256: 7651d29c7eebea809f4bd1dbd9b05431e2f15f08844f6941221d9283e3ef1819
  M420_PATCH_SHA256: 2213bb54f52600439ad393db4e9448764db3c3441c2a8dc109fc4e51e7bc909b
  M421_B64_SHA256: 16aac705b7aff8c759715514d4dbcc9054e0581efb9de670224677dd86f19fe6
  M421_XZ_SHA256: 5553f249c589c45f77b11dda1760cd34310b0a8b664008d901a8887691c9e995
  M421_PATCH_SHA256: 778dfafaa69381938e8c0c7b00069dbaa1958ada159daf028ab4f31a918371a7
  M422_B64_SHA256: a22426346e595ec4a6e0b94ed3ac29a027a0e58270ebf4f453e21f7483761fa8
  M422_XZ_SHA256: 78ff52ccdd6c8db278f175958b4aa99387a5fd334c442d4e78c7f4726269405e
  M422_PATCH_SHA256: f9336f99646c44b4a9067a9242aa9636f4543a76b0ee23760b7aee27cf6df32e
  LAUNCHER_SHA256: 2d84085648a1b055d75d5708fe0c9c42946d213691d4a0f4b99bb6bae6e93855

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct checksum-pinned patches and exact launcher
        shell: bash
        run: |
          set -euo pipefail
          cat m417-patch/part-*.txt | tr -d '[:space:]' > m417.patch.xz.b64
          tr -d '[:space:]' < m418-delta/part-00.txt > m418.patch.xz.b64
          tr -d '[:space:]' < m419-delta/engine.patch.xz.b64 > m419.patch.xz.b64
          tr -d '[:space:]' < m420-delta/engine.patch.xz.b64 > m420.patch.xz.b64
          tr -d '[:space:]' < m421-delta/engine.patch.xz.b64 > m421.patch.xz.b64
          tr -d '[:space:]' < m422-delta/engine.patch.xz.b64 > m422.patch.xz.b64

          for name in m417 m418 m419 m420 m421 m422; do
            upper=$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')
            eval "want_b64=\$${upper}_B64_SHA256"
            eval "want_xz=\$${upper}_XZ_SHA256"
            eval "want_patch=\$${upper}_PATCH_SHA256"
            echo "$want_b64  $name.patch.xz.b64" | sha256sum -c -
            base64 -d "$name.patch.xz.b64" > "$name.patch.xz"
            echo "$want_xz  $name.patch.xz" | sha256sum -c -
            xz -dc "$name.patch.xz" > "$name.patch"
            echo "$want_patch  $name.patch" | sha256sum -c -
          done

          tr -d '[:space:]' < m422-launcher/Start-TFE-Coop-Local.ps1.xz.b64 > launcher.xz.b64
          base64 -d launcher.xz.b64 > launcher.xz
          xz -dc launcher.xz > Start-TFE-Coop-Local.ps1
          echo "$LAUNCHER_SHA256  Start-TFE-Coop-Local.ps1" | sha256sum -c -

      - name: Reconstruct exact Milestone 4.2.2 source tree
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/TheForceEngine/TheForceEngine.git tfe
          git -C tfe checkout "$TFE_SHA"
          for patch in m417.patch m418.patch m419.patch m420.patch m421.patch m422.patch; do
            git -C tfe apply --check "$(pwd)/$patch"
            git -C tfe apply "$(pwd)/$patch"
          done
          install -m 0644 Start-TFE-Coop-Local.ps1 tfe/CoopLaunchers/Start-TFE-Coop-Local.ps1

          cat > tfe/UPSTREAM_COMMIT.txt <<EOF
          $TFE_SHA
          EOF
          cat > tfe/MILESTONE_VERSION.txt <<'EOF'
          4.2.2
          EOF
          cat > tfe/SOURCE_BUILD_INFO.txt <<EOF
          The Force Engine Co-op Milestone 4.2.2 corresponding source
          Upstream base commit: $TFE_SHA
          License: GPL-2.0

          Patch chain:
          - Milestone 4.1.7 cumulative patch: $M417_PATCH_SHA256
          - Milestone 4.1.8 delta: $M418_PATCH_SHA256
          - Milestone 4.1.9 delta: $M419_PATCH_SHA256
          - Milestone 4.2.0 delta: $M420_PATCH_SHA256
          - Milestone 4.2.1 delta: $M421_PATCH_SHA256
          - Milestone 4.2.2 delta: $M422_PATCH_SHA256
          - Exact Windows launcher: $LAUNCHER_SHA256

          This package deliberately stops at Milestone 4.2.2. It contains no
          Milestone 4.2.3 named-pipe/local-IPC work and no commercial Dark Forces assets.
          EOF

          mkdir -p tfe/PATCHES tfe/BuildScripts
          cp m417.patch tfe/PATCHES/TFE-Coop-Milestone-4.1.7-Base.patch
          cp m418.patch tfe/PATCHES/TFE-Coop-Milestone-4.1.8-Delta.patch
          cp m419.patch tfe/PATCHES/TFE-Coop-Milestone-4.1.9-Delta.patch
          cp m420.patch tfe/PATCHES/TFE-Coop-Milestone-4.2.0-Delta.patch
          cp m421.patch tfe/PATCHES/TFE-Coop-Milestone-4.2.1-Delta.patch
          cp m422.patch tfe/PATCHES/TFE-Coop-Milestone-4.2.2-Delta.patch

          cat > tfe/BUILDING_MILESTONE_4.2.2.md <<'EOF'
          # Building TFE Co-op Milestone 4.2.2

          This is the complete corresponding source for the Windows package labeled
          `TFE-Coop-Milestone-4.2.2-Native-MSVC-Windows-x64`.

          ## Windows x64 with Visual Studio/MSBuild

          Open `TheForceEngine.sln`, select `Release | x64`, and build. The released
          executable was built with the static multithreaded MSVC C/C++ runtime.
          `BuildScripts/Build-Windows-MSVC.ps1` performs the same project adjustment
          and invokes MSBuild when a compatible Visual Studio installation is present.

          ## CMake/Linux

          ```bash
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ```

          ## Co-op tests

          ```bash
          ./tests/coop/build_and_run.sh
          python3 Tools/CoopCertification/coop_campaign_certify.py --self-test
          ```

          Commercial Dark Forces data, fonts, and soundfonts are not included.
          EOF

          cat > tfe/BuildScripts/Build-Windows-MSVC.ps1 <<'EOF'
          [CmdletBinding()]
          param(
              [ValidateSet('Release','Debug')]
              [string]$Configuration = 'Release',
              [ValidateSet('x64','Win32')]
              [string]$Platform = 'x64'
          )
          $ErrorActionPreference = 'Stop'
          $root = Split-Path -Parent $PSScriptRoot
          $project = Join-Path $root 'TheForceEngine\TheForceEngine.vcxproj'
          $text = [IO.File]::ReadAllText($project)
          $condition = "'`$(Configuration)|`$(Platform)'=='$Configuration|$Platform'"
          $marker = "  <ItemDefinitionGroup Condition=`"$condition`">`r`n    <ClCompile>`r`n"
          if (-not $text.Contains($marker)) {
              $marker = "  <ItemDefinitionGroup Condition=`"$condition`">`n    <ClCompile>`n"
          }
          if (-not $text.Contains($marker)) { throw "Project configuration block not found: $Configuration|$Platform" }
          if (-not $text.Contains('<RuntimeLibrary>MultiThreaded</RuntimeLibrary>')) {
              $text = $text.Replace($marker, $marker + "      <RuntimeLibrary>MultiThreaded</RuntimeLibrary>" + [Environment]::NewLine)
              [IO.File]::WriteAllText($project, $text, [Text.UTF8Encoding]::new($true))
          }
          $msbuild = (Get-Command msbuild.exe -ErrorAction SilentlyContinue).Source
          if (-not $msbuild) { throw 'msbuild.exe was not found. Run from a Visual Studio Developer PowerShell.' }
          & $msbuild (Join-Path $root 'TheForceEngine.sln') /m /restore "/p:Configuration=$Configuration" "/p:Platform=$Platform" /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE." }
          EOF

          # Explicitly prove that the abandoned 4.2.3 local-IPC experiment is absent.
          if grep -R -n -E 'coop-local-channel|localIpcTransportTest|TFE-Coop-.*named-pipe' tfe/TheForceEngine tfe/tests 2>/dev/null; then
            echo 'Milestone 4.2.3 local-IPC marker found in the 4.2.2 tree.' >&2
            exit 1
          fi
          grep -q 'serviceHostCampaignFlow(now);' tfe/TheForceEngine/TFE_DarkForces/Coop/coop.cpp
          grep -q 'if (TFE_Coop::enabled()) { syncCoopCampaignFlow(); }' tfe/TheForceEngine/TFE_DarkForces/darkForcesMain.cpp
          grep -q 'STORMFIN.WAX' tfe/TheForceEngine/TFE_DarkForces/Coop/coop.cpp
          grep -q 'mute-music' tfe/TheForceEngine/main.cpp
          git -C tfe diff --check

      - name: Test source and create complete patch
        shell: bash
        run: |
          set -euo pipefail
          (cd tfe && ./tests/coop/build_and_run.sh)
          (cd tfe && python3 Tools/CoopCertification/coop_campaign_certify.py --self-test)
          git -C tfe add -A
          git -C tfe diff --cached --binary "$TFE_SHA" > tfe/TFE-Coop-Milestone-4.2.2-Complete.patch
          test -s tfe/TFE-Coop-Milestone-4.2.2-Complete.patch

      - name: Build clean, checksum-verified source ZIP
        shell: bash
        run: |
          set -euo pipefail
          root='TFE-Coop-Milestone-4.2.2-Source'
          rm -rf "$root" release
          mkdir -p "$root" release
          rsync -a --exclude='.git/' --exclude='build/' --exclude='*.user' tfe/ "$root"/

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          root = Path('TFE-Coop-Milestone-4.2.2-Source')
          manifest = root / 'SHA256SUMS.txt'
          rows = []
          for p in sorted(root.rglob('*')):
              if p.is_file() and p != manifest:
                  rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}")
          manifest.write_text('\n'.join(rows) + '\n', encoding='ascii')

          out = Path('release/TFE-Coop-Milestone-4.2.2-Source.zip')
          fixed = (2026, 8, 4, 12, 0, 0)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for p in sorted(root.rglob('*')):
                  if not p.is_file():
                      continue
                  arc = (Path(root.name) / p.relative_to(root)).as_posix()
                  info = zipfile.ZipInfo(arc, fixed)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  zf.writestr(info, p.read_bytes())
          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('release/TFE-Coop-Milestone-4.2.2-Source-SHA256.txt').write_text(
              f"{sha}  {out.name}\n", encoding='ascii')
          PY

          unzip -t release/TFE-Coop-Milestone-4.2.2-Source.zip
          rm -rf clean-check && mkdir clean-check
          unzip -q release/TFE-Coop-Milestone-4.2.2-Source.zip -d clean-check
          (cd clean-check/TFE-Coop-Milestone-4.2.2-Source && sha256sum -c SHA256SUMS.txt)
          test "$(cat clean-check/TFE-Coop-Milestone-4.2.2-Source/MILESTONE_VERSION.txt)" = '4.2.2'
          test "$(cat clean-check/TFE-Coop-Milestone-4.2.2-Source/UPSTREAM_COMMIT.txt)" = "$TFE_SHA"
          ! grep -R -n -E 'coop-local-channel|localIpcTransportTest' clean-check/TFE-Coop-Milestone-4.2.2-Source/TheForceEngine clean-check/TFE-Coop-Milestone-4.2.2-Source/tests

          cat > release/TFE-Coop-Milestone-4.2.2-Source-Validation.txt <<EOF
          Exact Milestone 4.2.2 source reconstruction: PASS
          Upstream commit: $TFE_SHA
          Patch-chain checksum validation: PASS
          Exact launcher checksum validation: PASS
          Protocol/session tests: PASS
          Campaign-certifier self-test: PASS
          Complete cumulative patch generation: PASS
          Milestone 4.2.3 local-IPC exclusion: PASS
          Complete source manifest verification: PASS
          Clean ZIP extraction and CRC validation: PASS
          EOF
          cat release/TFE-Coop-Milestone-4.2.2-Source-SHA256.txt

      - name: Upload source release artifact
        uses: actions/upload-artifact@v4
        with:
          name: TFE-Coop-Milestone-4.2.2-Source-Release
          path: release/
          if-no-files-found: error
          retention-days: 7
