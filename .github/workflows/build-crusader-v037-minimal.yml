name: Build Crusader Co-op v0.3.7 minimal

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-crusader-v037-minimal.yml'

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed_minimal
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache_minimal,readwrite
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/scummvm-src/.github/vcpkg-ports
      GIT_VCPKG_COMMIT: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct patch bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('crusader-v037/chunk-00','crusader-v037/chunk-01a','crusader-v037/chunk-01b1','crusader-v037/chunk-01b2','crusader-v037/chunk-02','crusader-v037/chunk-03')
          $b64 = (($files | ForEach-Object { Get-Content $_ -Raw }) -join '')
          [IO.File]::WriteAllText('source-patch.b64', $b64, [Text.Encoding]::ASCII)
          if ((Get-FileHash source-patch.b64 -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7d0124f33fe974c08261b745c0ce2dae5a25b8711906fc5b0accab212ce04d5b') { throw 'Payload hash mismatch' }
          [IO.File]::WriteAllBytes('source-patch.zip', [Convert]::FromBase64String($b64))
          if ((Get-FileHash source-patch.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5c6ddf230c34802017d2a60989ffa47b532f0e0d2829f52524ef7b68139b158e') { throw 'ZIP hash mismatch' }
          Expand-Archive source-patch.zip support -Force

      - name: Checkout ScummVM
        uses: actions/checkout@v4
        with:
          repository: scummvm/scummvm
          ref: v2026.3.0
          path: scummvm-src
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply co-op patch and reduce manifest
        shell: pwsh
        run: |
          python support/bundle/apply_coop_patch.py scummvm-src --package-root support/bundle
          if ($LASTEXITCODE -ne 0) { throw 'Patch failed' }
          @'
          {
            "name": "scummvm-crusader-coop",
            "version-string": "0.3.7",
            "dependencies": [
              "faad2",
              "freetype",
              "giflib",
              "libjpeg-turbo",
              "libmikmod",
              "libmpeg2",
              "libpng",
              "libvpx",
              "sdl2",
              "zlib"
            ]
          }
          '@ | Set-Content scummvm-src/vcpkg.json -Encoding ascii
          git -C scummvm-src diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed' }

      - uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgGitCommitId: ${{ env.GIT_VCPKG_COMMIT }}

      - name: Integrate vcpkg
        shell: pwsh
        run: '& "${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}/vcpkg" integrate install'

      - name: Restore minimal dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache_minimal
          key: crusader-v037-minimal-${{ env.GIT_VCPKG_COMMIT }}-${{ hashFiles('scummvm-src/vcpkg.json') }}

      - name: Install minimal dependencies
        working-directory: scummvm-src
        shell: pwsh
        run: |
          vcpkg install
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg failed' }

      - name: Build create_project
        working-directory: scummvm-src/devtools/create_project/cmake
        shell: pwsh
        run: |
          cmake .
          cmake --build . --config Debug -j 2
          if ($LASTEXITCODE -ne 0) { throw 'create_project build failed' }

      - name: Generate solution
        working-directory: scummvm-src
        shell: pwsh
        run: |
          New-Item -ItemType Directory build-scummvm -Force | Out-Null
          Push-Location build-scummvm
          & ../devtools/create_project/cmake/Debug/create_project.exe .. --msvc --vcpkg --disable-translation --disable-all-engines --enable-engine=ultima8 --enable-freetype2 --enable-faad --enable-gif --enable-mikmod --enable-mpeg2 --enable-vpx
          if ($LASTEXITCODE -ne 0) { throw 'create_project failed' }
          Pop-Location

      - uses: microsoft/setup-msbuild@v2

      - name: Build ScummVM
        working-directory: scummvm-src/build-scummvm
        shell: pwsh
        run: |
          msbuild scummvm.sln /m /p:VcpkgEnableManifest=true /p:BuildInParallel=true /p:Configuration=Release /p:PreferredToolArchitecture=x64 /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild failed' }

      - name: Package runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem scummvm-src/build-scummvm -Recurse -Filter scummvm.exe | Where-Object { $_.FullName -notmatch 'vcpkg' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'EXE not found' }
          New-Item -ItemType Directory built-runtime -Force | Out-Null
          Copy-Item $exe.FullName built-runtime/crusader-coop.exe
          Copy-Item scummvm-src/dists/engine-data/fonts.dat built-runtime/fonts.dat
          Copy-Item scummvm-src/dists/engine-data/ultima8.dat built-runtime/ultima8.dat
          $dllDir = Join-Path $env:VCPKG_INSTALLED_DIR 'x64-windows/bin'
          if (Test-Path $dllDir) { Get-ChildItem $dllDir -Filter '*.dll' -File | Copy-Item -Destination built-runtime -Force }
          git -C scummvm-src diff --binary --output='../built-runtime/scummvm-v2026.3.0-coop-v0.3.7.patch'
          $hash = (Get-FileHash built-runtime/crusader-coop.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content built-runtime/BUILD-RESULT.txt @('CrusaderCoop v0.3.7',"EXE_SHA256=$hash",'SCUMMVM_TAG=v2026.3.0','FREETYPE2=enabled','MANIFEST=minimal') -Encoding ascii
          Get-ChildItem built-runtime -File | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)" } | Set-Content built-runtime/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: crusader-coop-v0.3.7-minimal-built-runtime
          path: built-runtime/**
          if-no-files-found: error
          retention-days: 30
