name: Validate TFE Co-op M4.2.6.1 packaging fix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ENGINE_RUN_ID: 31313907703
  ENGINE_ARTIFACT: TFE-Coop-Milestone-4.2.6-MSVC-x64-HD-upscaler
  LAUNCHER_ARTIFACT: TFE-Coop-Milestone-4.2.6-Windows-Launcher

jobs:
  windows-powershell-51:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact corrected scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $items = @(
            @{ Input='m4261-package/VERIFY-WINDOWS.ps1.xz.b64'; Xz='verify.xz'; Output='VERIFY-WINDOWS.ps1'; XzHash='4e892ac6d09bd2e35eefe847581d35a29daf5cf2b7460ebccfd9f32ee67c47c9'; SourceHash='53c44941bcee2d158c1fb165480b8bf95306855cc86fc17e74022f4642db6f43' },
            @{ Input='m4261-package/SETUP-WINDOWS.bat.xz.b64'; Xz='setup.xz'; Output='SETUP-WINDOWS.bat'; XzHash='0323eb2fab4d4fec86e5a9d2642b5e916bdeb0a2e7a23448298cb4fcec59cb67'; SourceHash='10ca5648dafb040c9cdf412e67ce8e23c14b403e4ceac81084c55bb15272ad4f' },
            @{ Input='m4261-package/Repair-TFE-Coop-Profiles.ps1.xz.b64'; Xz='repair.xz'; Output='Repair-TFE-Coop-Profiles.ps1'; XzHash='d43dcff1b4be753d3003ce79b6f51ebf7a9228c81119cda0fc024c9ad9c6972c'; SourceHash='a3b03857696a6c61fa27ef6c8a281318735f7238baebf2aa6894cab7fc883263' }
          )
          foreach ($item in $items) {
            $compact = (Get-Content -LiteralPath $item.Input -Raw) -replace '\s',''
            [IO.File]::WriteAllBytes($item.Xz, [Convert]::FromBase64String($compact))
            $xzHash = (Get-FileHash -LiteralPath $item.Xz -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($xzHash -ne $item.XzHash) { throw "$($item.Output) XZ checksum mismatch: $xzHash" }
          }
          @'
          import hashlib, lzma
          from pathlib import Path
          items = [
            ('verify.xz','VERIFY-WINDOWS.ps1','53c44941bcee2d158c1fb165480b8bf95306855cc86fc17e74022f4642db6f43'),
            ('setup.xz','SETUP-WINDOWS.bat','10ca5648dafb040c9cdf412e67ce8e23c14b403e4ceac81084c55bb15272ad4f'),
            ('repair.xz','Repair-TFE-Coop-Profiles.ps1','a3b03857696a6c61fa27ef6c8a281318735f7238baebf2aa6894cab7fc883263'),
          ]
          for compressed, output, expected in items:
              source = lzma.decompress(Path(compressed).read_bytes())
              actual = hashlib.sha256(source).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{output} checksum mismatch: {actual}')
              Path(output).write_bytes(source)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Script reconstruction failed.' }

          $setupBytes = [IO.File]::ReadAllBytes((Resolve-Path .\SETUP-WINDOWS.bat))
          if ($setupBytes[0] -eq 0xEF -and $setupBytes[1] -eq 0xBB -and $setupBytes[2] -eq 0xBF) { throw 'Setup still has a UTF-8 BOM.' }
          $setupText = [Text.Encoding]::ASCII.GetString($setupBytes)
          if ($setupText.Contains('^|')) { throw 'Setup still contains the broken caret-pipe sequence.' }
          if ($setupText.Contains('Milestone 4.2.4')) { throw 'Setup still contains stale 4.2.4 branding.' }

      - name: Download exact engine and launcher artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force fixture,launcher-download | Out-Null
          gh run download $env:ENGINE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:ENGINE_ARTIFACT --dir fixture
          if ($LASTEXITCODE -ne 0) { throw 'Engine artifact download failed.' }
          gh run download $env:ENGINE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:LAUNCHER_ARTIFACT --dir launcher-download
          if ($LASTEXITCODE -ne 0) { throw 'Launcher artifact download failed.' }
          Copy-Item launcher-download\Start-TFE-Coop-Local.ps1 fixture\Start-TFE-Coop-Local.ps1
          Copy-Item .\VERIFY-WINDOWS.ps1 fixture\VERIFY-WINDOWS.ps1
          Copy-Item .\SETUP-WINDOWS.bat fixture\SETUP-WINDOWS.bat
          Copy-Item .\Repair-TFE-Coop-Profiles.ps1 fixture\Repair-TFE-Coop-Profiles.ps1

      - name: Construct exact verifier fixture and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path fixture\DEPENDENCIES.txt) { Move-Item fixture\DEPENDENCIES.txt fixture\NATIVE-MSVC-DEPENDENCIES.txt }
          if (Test-Path fixture\PE-HEADERS.txt) { Move-Item fixture\PE-HEADERS.txt fixture\NATIVE-MSVC-PE-HEADERS.txt }
          if (Test-Path fixture\SHA256SUMS.txt) { Move-Item fixture\SHA256SUMS.txt fixture\NATIVE-MSVC-ARTIFACT-SHA256SUMS.txt }

          $m424 = ((Get-Content m424-delta\engine.patch.xz.b64 -Raw) -replace '\s','')
          [IO.File]::WriteAllBytes('m424.patch.xz',[Convert]::FromBase64String($m424))
          @'
          import lzma
          from pathlib import Path
          Path('fixture/TFE-Coop-Milestone-4.2.4-Engine-Delta.patch').write_bytes(lzma.decompress(Path('m424.patch.xz').read_bytes()))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw '4.2.4 delta reconstruction failed.' }

          $required = @(
            'Host-Coop.bat','Join-Coop.bat','Start-Local-SplitScreen.bat','Start-Local-SplitScreen-TopBottom.bat',
            'Start-Local-SplitScreen-Keyboard-Controller.bat','Start-Local-SplitScreen-Keyboard-Controller-TopBottom.bat',
            'Start-Local-SplitScreen-Controller-Keyboard.bat','Start-Local-SplitScreen-Controller-Keyboard-TopBottom.bat',
            'Start-Local-SplitScreen-Two-Controllers.bat','Start-Local-SplitScreen-Two-Controllers-TopBottom.bat',
            'Start-Local-SplitScreen-HD-Presets.bat','Start-Local-SplitScreen-HD-Presets-TopBottom.bat',
            'Repair-TFE-Coop-Profiles.bat','Prepare-From-Official-TFE.bat','START-HERE-WINDOWS.txt','LOCAL-COOP-INPUT-README.txt',
            'MILESTONE4_2_2_STARTUP_BARRIER_FIX.txt','MILESTONE4_2_4_REMOTE_ANIMATION_FIX.txt','MILESTONE4_2_6_HD_UPSCALER.txt',
            'MILESTONE4_2_6_1_PACKAGING_FIX.txt','PACKAGE-REVISION.txt','ENGINE-BUILD-INFO.txt','BUILD-PROVENANCE.txt',
            'SOURCE_CODE.txt','PACKAGE-VALIDATION.txt','MICROSOFT-VC-RUNTIME-NOTE.txt','MULTIMEDIA-DLL-DEPENDENCIES.txt'
          )
          foreach ($name in $required) {
            $path = Join-Path fixture $name
            if (-not (Test-Path -LiteralPath $path)) { Set-Content -LiteralPath $path -Value 'Milestone 4.2.6.1 verifier fixture' -Encoding Ascii }
          }
          Set-Content fixture\Repair-TFE-Coop-Profiles.bat '@exit /b 0' -Encoding Ascii
          New-Item -ItemType Directory -Force fixture\Fonts | Out-Null
          Set-Content fixture\Fonts\OpenSans-Regular.ttf 'CI fixture' -Encoding Ascii

          $root = (Resolve-Path fixture).Path
          Get-ChildItem fixture -Recurse -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring($root.Length + 1).Replace('\\','/')
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "${hash}  ${relative}"
            } | Set-Content fixture\SHA256SUMS.txt -Encoding Ascii

      - name: Run exact corrected verifier on Windows PowerShell 5.1
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File fixture\VERIFY-WINDOWS.ps1
          if ($LASTEXITCODE -ne 0) { throw "Corrected verifier returned $LASTEXITCODE." }

      - name: Run exact corrected SETUP-WINDOWS.bat through cmd.exe
        shell: cmd
        env:
          TFE_COOP_NO_PAUSE: '1'
        run: |
          cd /d fixture
          call SETUP-WINDOWS.bat
          if errorlevel 1 exit /b %errorlevel%
          echo Exact BOM-free setup execution: PASS
