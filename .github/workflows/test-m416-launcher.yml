name: Test TFE Co-op 4.1.6 launcher
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Decode exact launcher and verifier
        shell: pwsh
        run: |
          @'
          import base64, hashlib, lzma
          from pathlib import Path
          items = [
              ('m416/Start-TFE-Coop-Local.ps1.xz.b64', 'Start-TFE-Coop-Local.ps1', '437ace00907fe70176abada499572712935beaf910e636db95cd4659878994a9'),
              ('m416/VERIFY-WINDOWS.ps1.xz.b64', 'VERIFY-WINDOWS.ps1', '586f7d0a3befcf387b73a14938700752ab29a934ca5007ebcc4dd952284c656a'),
          ]
          for encoded_path, output_path, expected in items:
              compact = ''.join(Path(encoded_path).read_text(encoding='utf-8').split())
              source = lzma.decompress(base64.b64decode(compact, validate=True))
              digest = hashlib.sha256(source).hexdigest()
              if digest != expected:
                  raise SystemExit(f'{output_path} checksum mismatch: {digest}')
              Path(output_path).write_bytes(source)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Decode failed' }
          foreach ($name in @(
            'theforceengine.exe','SDL2.dll','SDL2_image.dll','libc++.dll','libunwind.dll',
            'Host-Coop.bat','Join-Coop.bat','Start-Local-SplitScreen-Keyboard-Controller.bat',
            'Repair-TFE-Coop-Profiles.ps1','Repair-TFE-Coop-Profiles.bat','MILESTONE4_1_6_GEOMETRY_FIX.txt'
          )) {
            New-Item -ItemType File -Path (Join-Path $PWD $name) -Force | Out-Null
          }
      - name: Parse and execute exact launcher preflight
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\Start-TFE-Coop-Local.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'Launcher parser errors' }
          foreach ($layout in @('Vertical','Horizontal')) {
            foreach ($mode in @('KeyboardController','ControllerKeyboard','TwoControllers')) {
              $result = & .\Start-TFE-Coop-Local.ps1 -Layout $layout -InputMode $mode -PreflightOnly
              $json = $result | Where-Object { "$_" -match '^\{.*\}$' } | Select-Object -Last 1
              if (-not $json) { throw "No JSON for $layout/$mode" }
              $data = $json | ConvertFrom-Json
              if ($data.HostRectangle -notmatch '^-?\d+,-?\d+,\d+,\d+$') { throw 'Bad host rectangle' }
              if ($data.ClientRectangle -notmatch '^-?\d+,-?\d+,\d+,\d+$') { throw 'Bad client rectangle' }
            }
          }
          Write-Host 'PowerShell 5.1 parse and geometry execution: PASS'
      - name: Execute exact package verifier
        shell: powershell
        run: |
          & .\VERIFY-WINDOWS.ps1
          if ($LASTEXITCODE -ne 0) { throw "Verifier failed with exit code $LASTEXITCODE" }
          Write-Host 'Exact package verifier execution: PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: TFE-Coop-Milestone-4.1.6-Validated-Scripts
          path: |
            Start-TFE-Coop-Local.ps1
            VERIFY-WINDOWS.ps1
          if-no-files-found: error
          retention-days: 7
