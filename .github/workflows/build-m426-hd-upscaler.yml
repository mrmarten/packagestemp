name: Build TFE Co-op M4.2.6 HD upscaler

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    name: Source, shaders, protocol, sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact Milestone 4.2.6 source from 4.2.4
        shell: bash
        run: |
          set -euo pipefail
          cat m417-patch/part-*.txt | tr -d '[:space:]' | base64 -d > m417.patch.xz
          tr -d '[:space:]' < m418-delta/part-00.txt | base64 -d > m418.patch.xz
          tr -d '[:space:]' < m419-delta/engine.patch.xz.b64 | base64 -d > m419.patch.xz
          tr -d '[:space:]' < m420-delta/engine.patch.xz.b64 | base64 -d > m420.patch.xz
          tr -d '[:space:]' < m421-delta/engine.patch.xz.b64 | base64 -d > m421.patch.xz
          tr -d '[:space:]' < m422-delta/engine.patch.xz.b64 | base64 -d > m422.patch.xz
          tr -d '[:space:]' < m424-delta/engine.patch.xz.b64 | base64 -d > m424.patch.xz
          tr -d '[:space:]' < m426-delta/engine.patch.xz.b64 | base64 -d > m426.patch.xz

          echo '95995772a116923b9c26773c1a97468ce931f6b9240a3a3a21bd8ef7283c11dd  m417.patch.xz' | sha256sum -c -
          echo '938d3cb1441f33b71b297c50d7a2bfdc14dc1b9a67c99f086ea43d79fee3db1f  m418.patch.xz' | sha256sum -c -
          echo 'ddeb4959895c7dc722e07aca889930227371b6e077647a2c0c286a076a8a0652  m419.patch.xz' | sha256sum -c -
          echo '7651d29c7eebea809f4bd1dbd9b05431e2f15f08844f6941221d9283e3ef1819  m420.patch.xz' | sha256sum -c -
          echo '5553f249c589c45f77b11dda1760cd34310b0a8b664008d901a8887691c9e995  m421.patch.xz' | sha256sum -c -
          echo '78ff52ccdd6c8db278f175958b4aa99387a5fd334c442d4e78c7f4726269405e  m422.patch.xz' | sha256sum -c -
          echo 'cc61e385b1010cb309b57a19eaef4cd224d2b1a6dbadd1643490c1fd2fa42418  m424.patch.xz' | sha256sum -c -
          echo 'd2d6500f14df79b438889873fa36bc992b9c3d46ce294a68a4d9259dd5292ac0  m426.patch.xz' | sha256sum -c -

          for name in m417 m418 m419 m420 m421 m422 m424 m426; do xz -dc "$name.patch.xz" > "$name.patch"; done
          echo '930647d0fd18912203c0dda3b028f950134830e84925c01700c65f48d40e41c0  m417.patch' | sha256sum -c -
          echo '788da95b1e4310ce270fd0553b02fb9e14e5b6668c40764b5dd4bff03fe434ae  m418.patch' | sha256sum -c -
          echo 'f6302f64d6d62800bdba755d69e892c089c03a166d5809d2634361ef32bc3466  m419.patch' | sha256sum -c -
          echo '2213bb54f52600439ad393db4e9448764db3c3441c2a8dc109fc4e51e7bc909b  m420.patch' | sha256sum -c -
          echo '778dfafaa69381938e8c0c7b00069dbaa1958ada159daf028ab4f31a918371a7  m421.patch' | sha256sum -c -
          echo 'f9336f99646c44b4a9067a9242aa9636f4543a76b0ee23760b7aee27cf6df32e  m422.patch' | sha256sum -c -
          echo '16d2a11968b41215c6146ef0cdfa44c3a9422eec35a55654a27d8378f036b546  m424.patch' | sha256sum -c -
          echo '69aa1319cbcd693b591f2d56236de9032604f8083f10b1be866c2a318c99f5ba  m426.patch' | sha256sum -c -

          git clone --depth 1 https://github.com/TheForceEngine/TheForceEngine.git tfe
          git -C tfe fetch --depth 1 origin 54eab324e9b265c503b51c3690f030f42a0f9fcc
          git -C tfe checkout 54eab324e9b265c503b51c3690f030f42a0f9fcc
          for patch in m417.patch m418.patch m419.patch m420.patch m421.patch m422.patch m424.patch m426.patch; do
            git -C tfe apply --check "$(pwd)/$patch"
            git -C tfe apply "$(pwd)/$patch"
          done
          git -C tfe diff --check
          cp m426.patch tfe/TFE-Coop-Milestone-4.2.6-Engine-Delta.patch

      - name: Validate HD upscaler and preserved 4.2.4 functionality
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main = Path('tfe/TheForceEngine/main.cpp').read_text()
          blit_h = Path('tfe/TheForceEngine/TFE_PostProcess/blit.h').read_text()
          blit_cpp = Path('tfe/TheForceEngine/TFE_PostProcess/blit.cpp').read_text()
          backend = Path('tfe/TheForceEngine/TFE_RenderBackend/Win32OpenGL/renderBackend.cpp').read_text()
          shader = Path('tfe/TheForceEngine/Shaders/blit.frag').read_text()
          coop = Path('tfe/TheForceEngine/TFE_DarkForces/Coop/coop.cpp').read_text()
          required = {
              'HD command line': all(x in main for x in ('hd-upscale','hd-render-scale','hd-sharpness')),
              'hardware true color': 'RENDERER_HARDWARE' in main and 'COLORMODE_TRUE_COLOR' in main,
              'high internal resolution': 'graphics->gameResolution.z = internalHeight;' in main,
              'render backend configuration': 'configureHdUpscale(true' in main and 'configureHdUpscale(bool enabled' in backend,
              'dedicated HD feature': 'BLIT_HD_UPSCALE' in blit_h and 'ENABLE_HD_UPSCALE' in blit_cpp,
              'GLSL 330 HD variants': 'SHADER_VER_STD' in blit_cpp,
              'Catmull-Rom reconstruction': 'cubicCatmullRom' in shader and 'sampleHdAdaptive' in shader,
              'anti-ringing clamp': 'bicubic = clamp(bicubic, localMin, localMax);' in shader,
              'contrast-adaptive sharpen': 'sharpenAmount' in shader and 'localContrast' in shader,
              'spatial no temporal history': 'motion vectors or frame history' in shader,
              '4.2.4 animation retained': 'RemotePlayerAnimationState' in coop and 's_troopAnimTable[ANIM_ATTACK1]' in coop,
              'working 4.2.2 networking retained': 'serviceHostCampaignFlow(now);' in coop,
              'abandoned 4.2.3 IPC excluded': 'coop-local-channel' not in main and 'NamedPipe' not in coop,
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed: raise SystemExit('M4.2.6 guard failed: ' + ', '.join(failed))
          print('Milestone 4.2.6 source guards: PASS')
          PY

      - name: Compile all HD GLSL feature combinations
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          shader='tfe/TheForceEngine/Shaders/blit.frag'
          for defs in \
            'ENABLE_HD_UPSCALE' \
            'ENABLE_HD_UPSCALE ENABLE_GPU_COLOR_CONVERSION' \
            'ENABLE_HD_UPSCALE ENABLE_GPU_COLOR_CORRECTION' \
            'ENABLE_HD_UPSCALE ENABLE_GPU_COLOR_CONVERSION ENABLE_GPU_COLOR_CORRECTION' \
            'ENABLE_HD_UPSCALE ENABLE_BLOOM' \
            'ENABLE_HD_UPSCALE ENABLE_BLOOM ENABLE_GPU_COLOR_CORRECTION'; do
            out="/tmp/blit-$(echo "$defs" | tr ' ' '-').frag"
            {
              echo '#version 330'
              for d in $defs; do echo "#define $d 1"; done
              cat "$shader"
            } > "$out"
            glslangValidator -S frag "$out"
          done
          echo 'All six HD shader variants: PASS'

      - name: Run protocol, session, sanitizers, and campaign tests
        shell: bash
        run: |
          set -euo pipefail
          cd tfe
          ./tests/coop/build_and_run.sh
          COOP_SANITIZE=1 COOP_TEST_BUILD_DIR=build/coop-tests-sanitized \
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ./tests/coop/build_and_run.sh
          python3 Tools/CoopCertification/coop_campaign_certify.py --self-test

      - name: Archive tested source tree
        shell: bash
        run: tar -czf tfe-m426-source.tar.gz tfe

      - uses: actions/upload-artifact@v4
        with:
          name: TFE-Coop-Milestone-4.2.6-Tested-Source
          path: tfe-m426-source.tar.gz
          if-no-files-found: error
          retention-days: 7

  launcher:
    name: Exact launcher on Windows PowerShell 5.1
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact launcher
        shell: pwsh
        run: |
          $compact = (Get-Content m426-package/Start-TFE-Coop-Local.ps1.xz.b64 -Raw) -replace '\s',''
          [IO.File]::WriteAllBytes('launcher.xz', [Convert]::FromBase64String($compact))
          if ((Get-FileHash launcher.xz -Algorithm SHA256).Hash.ToLowerInvariant() -ne '69a3d7c9c3d8c647f9ccaffbb8027aef6b0a367bb32498a70487756b35f30545') { throw 'Launcher XZ checksum mismatch.' }
          @'
          import hashlib, lzma
          from pathlib import Path
          source = lzma.decompress(Path('launcher.xz').read_bytes())
          expected = 'd2328c76b9ceda86593681660d60042df02f8f3fc462f16d08578f105f7b08f1'
          actual = hashlib.sha256(source).hexdigest()
          if actual != expected: raise SystemExit(f'launcher checksum mismatch: {actual}')
          Path('Start-TFE-Coop-Local.ps1').write_bytes(source)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Launcher reconstruction failed.' }
          New-Item -ItemType File .\theforceengine.exe -Force | Out-Null

      - name: Parse and execute every HD preset/layout/input preflight
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\Start-TFE-Coop-Local.ps1),[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List -Force; throw 'Windows PowerShell 5.1 parser errors.' }
          foreach ($layout in @('Vertical','Horizontal')) {
            foreach ($mode in @('KeyboardController','ControllerKeyboard','TwoControllers')) {
              foreach ($preset in @('Ultra','Quality','Balanced','Performance','Classic')) {
                $output = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\Start-TFE-Coop-Local.ps1 `
                  -Layout $layout -InputMode $mode -HdQuality $preset -HdSharpness 0.25 -PreflightOnly 2>&1
                if ($LASTEXITCODE -ne 0) { $output | ForEach-Object { Write-Host $_ }; throw "Preflight failed: $layout / $mode / $preset" }
                $json = $output | Where-Object { "$_" -match '^\{.*\}$' } | Select-Object -Last 1
                $data = $json | ConvertFrom-Json
                if ($data.Version -ne '4.2.6') { throw 'Wrong version.' }
                if ($preset -eq 'Classic') {
                  if ([bool]$data.HdUpscaleEnabled) { throw 'Classic must disable HD.' }
                  if ($data.HostArguments -match '--hd-upscale' -or $data.ClientArguments -match '--hd-upscale') { throw 'Classic arguments contain HD switch.' }
                } else {
                  if (-not [bool]$data.HdUpscaleEnabled) { throw 'HD preset disabled unexpectedly.' }
                  foreach ($args in @([string]$data.HostArguments,[string]$data.ClientArguments)) {
                    if ($args -notmatch '--hd-upscale' -or $args -notmatch '--hd-render-scale' -or $args -notmatch '--hd-sharpness') { throw 'HD arguments incomplete.' }
                  }
                }
              }
            }
          }
          Write-Host 'All 30 HD/classic launcher preflights: PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: TFE-Coop-Milestone-4.2.6-Windows-Launcher
          path: Start-TFE-Coop-Local.ps1
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Native MSVC x64 engine
    needs: source-tests
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TFE-Coop-Milestone-4.2.6-Tested-Source
      - uses: microsoft/setup-msbuild@v2

      - name: Extract tested source and force static MSVC runtime
        shell: pwsh
        run: |
          tar -xzf tfe-m426-source.tar.gz
          @'
          from pathlib import Path
          project = Path('tfe/TheForceEngine/TheForceEngine.vcxproj')
          text = project.read_text(encoding='utf-8-sig')
          marker = "  <ItemDefinitionGroup Condition=\"'$(Configuration)|$(Platform)'=='Release|x64'\">\n    <ClCompile>\n"
          if marker not in text: raise SystemExit('Release x64 ClCompile block not found')
          if '<RuntimeLibrary>MultiThreaded</RuntimeLibrary>' not in text:
              text = text.replace(marker, marker + '      <RuntimeLibrary>MultiThreaded</RuntimeLibrary>\n', 1)
          project.write_text(text, encoding='utf-8-sig', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set static MSVC runtime.' }

      - name: Build Windows x64 with MSVC
        shell: pwsh
        run: |
          msbuild tfe\TheForceEngine.sln /m /restore /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE." }

      - name: Package, inspect, and loader-smoke-test native engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem tfe -Recurse -Filter *.exe | Where-Object { $_.Name -match '^TheForceEngine\.exe$|^theforceengine\.exe$' -and $_.FullName -match '\\Release\\' } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'The Force Engine executable was not found.' }
          $pdb = Get-ChildItem tfe -Recurse -Filter *.pdb | Where-Object { $_.Name -match '^TheForceEngine\.pdb$|^theforceengine\.pdb$' -and $_.FullName -match '\\Release\\' } | Sort-Object Length -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force artifact\Shaders | Out-Null
          Copy-Item $exe.FullName artifact\theforceengine.exe
          if ($pdb) { Copy-Item $pdb.FullName artifact\theforceengine.pdb }
          foreach ($dll in @('SDL2.dll','SDL2_image.dll','ogg.dll','theora.dll','vorbis.dll')) {
            $source = Join-Path 'tfe\TheForceEngine' $dll
            if (-not (Test-Path $source -PathType Leaf)) { throw "Missing runtime DLL: $dll" }
            Copy-Item $source artifact\$dll
          }
          Copy-Item tfe\TheForceEngine\Shaders\blit.frag artifact\Shaders\blit.frag
          Copy-Item tfe\TheForceEngine\Shaders\blit.vert artifact\Shaders\blit.vert
          Copy-Item tfe\TFE-Coop-Milestone-4.2.6-Engine-Delta.patch artifact\
          Copy-Item tfe\LICENSE artifact\LICENSE

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual Studio C++ toolchain not found.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $runtime = Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC') -Recurse -Filter VCRUNTIME140.dll -File | Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC\d+\.CRT\\VCRUNTIME140\.dll$' -and $_.FullName -notmatch '\\onecore\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $runtime) { throw 'Signed x64 VCRUNTIME140.dll not found.' }
          $sig = Get-AuthenticodeSignature $runtime.FullName
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'VCRUNTIME140 signature validation failed.' }
          Copy-Item $runtime.FullName artifact\VCRUNTIME140.dll
          @("Source: $($runtime.FullName)","SHA-256: $((Get-FileHash $runtime.FullName -Algorithm SHA256).Hash.ToLowerInvariant())","Signature status: $($sig.Status)","Signer: $($sig.SignerCertificate.Subject)") | Set-Content artifact\VCRUNTIME140-PROVENANCE.txt -Encoding UTF8

          $cmd = 'call "' + $vcvars + '" && dumpbin.exe /headers artifact\theforceengine.exe > artifact\PE-HEADERS.txt && dumpbin.exe /dependents artifact\theforceengine.exe > artifact\DEPENDENCIES.txt'
          & cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin validation failed.' }
          $deps = Get-Content artifact\DEPENDENCIES.txt -Raw
          foreach ($forbidden in @('libunwind.dll','libc++.dll','VCRUNTIME140.dll','MSVCP140.dll')) { if ($deps -match [regex]::Escape($forbidden)) { throw "Forbidden direct dependency: $forbidden" } }
          if ((Get-Content artifact\PE-HEADERS.txt -Raw) -notmatch 'machine \(x64\)') { throw 'Executable is not x64.' }

          Push-Location artifact
          try {
            $smoke = Start-Process .\theforceengine.exe -ArgumentList '--help' -PassThru
            Start-Sleep -Seconds 3
            if (-not $smoke.HasExited) { Stop-Process -Id $smoke.Id -Force; $smoke.WaitForExit() }
          } catch { throw "Windows loader smoke test failed: $($_.Exception.Message)" }
          finally { Pop-Location }

          Get-ChildItem -LiteralPath artifact -Recurse -File | Get-FileHash -Algorithm SHA256 | Sort-Object Path | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), $_.Path.Substring((Resolve-Path artifact).Path.Length + 1).Replace('\\','/') } | Set-Content artifact\SHA256SUMS.txt -Encoding Ascii
          Get-Content artifact\DEPENDENCIES.txt
          Get-Content artifact\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TFE-Coop-Milestone-4.2.6-MSVC-x64-HD-upscaler
          path: artifact/
          if-no-files-found: error
          retention-days: 7
