name: Decode TFE M4 hotfix patch

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct compressed patch
        shell: bash
        run: |
          set -euo pipefail
          cat $(find patches/m4-hotfix -maxdepth 1 -type f -name 'part-*.txt' | sort) > m4-hotfix.patch.xz.b64
          base64 --decode m4-hotfix.patch.xz.b64 > m4-hotfix.patch.xz
          xz -t m4-hotfix.patch.xz
          xz --decompress --stdout m4-hotfix.patch.xz > m4-hotfix.patch
          sha256sum m4-hotfix.patch.xz.b64 m4-hotfix.patch.xz m4-hotfix.patch > SHA256SUMS.txt
          head -40 m4-hotfix.patch
      - uses: actions/upload-artifact@v4
        with:
          name: decoded-m4-hotfix-patch
          path: |
            m4-hotfix.patch
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
