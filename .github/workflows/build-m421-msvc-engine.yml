name: Build TFE Co-op M4.2.1 native MSVC engine

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TFE_SHA: 54eab324e9b265c503b51c3690f030f42a0f9fcc
  M417_B64_SHA256: f2a7eec673a104572bc8d5f70aabdf872b4581a36c5b89ddd8688e810b12d458
  M417_XZ_SHA256: 95995772a116923b9c26773c1a97468ce931f6b9240a3a3a21bd8ef7283c11dd
  M417_PATCH_SHA256: 930647d0fd18912203c0dda3b028f950134830e84925c01700c65f48d40e41c0
  M418_B64_SHA256: 89a777082a42c8d1881dda2148025d37129bebf0b2030f2159c576fc02c78bf6
  M418_XZ_SHA256: 938d3cb1441f33b71b297c50d7a2bfdc14dc1b9a67c99f086ea43d79fee3db1f
  M418_PATCH_SHA256: 788da95b1e4310ce270fd0553b02fb9e14e5b6668c40764b5dd4bff03fe434ae
  M419_B64_SHA256: 3bfbecf0a4883fa44f64823dcb86eadfc8299c2b6b5523aa00e313ad0c459b0a
  M419_XZ_SHA256: ddeb4959895c7dc722e07aca889930227371b6e077647a2c0c286a076a8a0652
  M419_PATCH_SHA256: f6302f64d6d62800bdba755d69e892c089c03a166d5809d2634361ef32bc3466
  M420_B64_SHA256: cbe74d71c22f3baedf831fb15257da66d08757ce5121a26595581d76ceaed440
  M420_XZ_SHA256: 7651d29c7eebea809f4bd1dbd9b05431e2f15f08844f6941221d9283e3ef1819
  M420_PATCH_SHA256: 2213bb54f52600439ad393db4e9448764db3c3441c2a8dc109fc4e51e7bc909b
  M421_B64_SHA256: 39d2518dce4dc6bf8dcc7c3b71536607e0e2e292d37621a6952edcba64c4c588
  M421_XZ_SHA256: e47078b12f0fae67d1db31e02962f6da92bfd36773f20262122392ed0662559f
  M421_PATCH_SHA256: 3bec87a11f56f29a263afc270090e31136fce566f79a700c50a93ad76da66046

jobs:
  protocol-and-regression-tests:
    name: Protocol tests, sanitizers, synchronization/controller/audio regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct patched source
        shell: bash
        run: |
          set -euo pipefail
          cat m417-patch/part-*.txt | tr -d '[:space:]' > m417.patch.xz.b64
          tr -d '[:space:]' < m418-delta/part-00.txt > m418.patch.xz.b64
          tr -d '[:space:]' < m419-delta/engine.patch.xz.b64 > m419.patch.xz.b64
          tr -d '[:space:]' < m420-delta/engine.patch.xz.b64 > m420.patch.xz.b64
          tr -d '[:space:]' < m421-delta/engine.patch.xz.b64 > m421.patch.xz.b64

          for name in m417 m418 m419 m420 m421; do
            upper=$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')
            eval expected_b64=\${${upper}_B64_SHA256}
            eval expected_xz=\${${upper}_XZ_SHA256}
            eval expected_patch=\${${upper}_PATCH_SHA256}
            echo "$expected_b64  $name.patch.xz.b64" | sha256sum -c -
            base64 -d "$name.patch.xz.b64" > "$name.patch.xz"
            echo "$expected_xz  $name.patch.xz" | sha256sum -c -
            xz -dc "$name.patch.xz" > "$name.patch"
            echo "$expected_patch  $name.patch" | sha256sum -c -
          done

          git clone --depth 1 https://github.com/TheForceEngine/TheForceEngine.git tfe
          git -C tfe fetch --depth 1 origin "${TFE_SHA}"
          git -C tfe checkout "${TFE_SHA}"
          for patch in m417.patch m418.patch m419.patch m420.patch m421.patch; do
            git -C tfe apply --check "$(pwd)/$patch"
            git -C tfe apply "$(pwd)/$patch"
          done
          git -C tfe diff --check

          python3 - <<'PY'
          from pathlib import Path
          main = Path('tfe/TheForceEngine/main.cpp').read_text()
          coop = Path('tfe/TheForceEngine/TFE_DarkForces/Coop/coop.cpp').read_text()
          coop_h = Path('tfe/TheForceEngine/TFE_DarkForces/Coop/coop.h').read_text()
          df = Path('tfe/TheForceEngine/TFE_DarkForces/darkForcesMain.cpp').read_text()
          required = {
              'peer barrier CLI': 'coop-wait-for-peer' in main,
              'peer barrier config': 'configureCampaignPeerBarrier' in coop and 'configureCampaignPeerBarrier' in coop_h,
              'campaign frozen until connected': 'if (!TFE_Coop::campaignPeerReady()) { return; }' in df,
              'client music mute CLI': 'mute-music' in main,
              'game and cutscene music zeroed': 'soundSettings->musicVolume = 0.0f' in main and 'soundSettings->cutsceneMusicVolume = 0.0f' in main,
              'controller open retry': 'frame < 600u' in main and 'openConfiguredController(s_controllerDeviceIndex)' in main,
              'visible remote player': 'STORMFIN.WAX' in coop,
              'widescreen/FOV retained': 'strcasecmp(name, "widescreen")' in main and 'strcasecmp(name, "fov")' in main,
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit('M4.2.1 regression guard failed: ' + ', '.join(failed))
          print('M4.2.1 synchronization/controller/audio regression guards: PASS')
          PY

      - name: Run protocol and session tests
        shell: bash
        run: |
          set -euo pipefail
          cd tfe
          ./tests/coop/build_and_run.sh

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        shell: bash
        env:
          COOP_SANITIZE: '1'
          COOP_TEST_BUILD_DIR: build/coop-tests-sanitized
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cd tfe
          ./tests/coop/build_and_run.sh

      - name: Validate campaign-certifier fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd tfe
          python3 Tools/CoopCertification/coop_campaign_certify.py --self-test

  windows:
    name: Native MSVC x64 engine with synchronization/controller/audio fixes
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Reconstruct and apply Milestones 4.1.7 through 4.2.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem m417-patch/part-*.txt | Sort-Object Name
          if ($parts.Count -ne 12) { throw "Expected 12 Milestone 4.1.7 chunks, found $($parts.Count)." }
          $items = @(
            @{Name='m417'; Compact=(($parts | ForEach-Object {[IO.File]::ReadAllText($_.FullName)}) -join '') -replace '\s',''; B64=$env:M417_B64_SHA256; Xz=$env:M417_XZ_SHA256; Patch=$env:M417_PATCH_SHA256},
            @{Name='m418'; Compact=([IO.File]::ReadAllText((Resolve-Path m418-delta/part-00.txt))) -replace '\s',''; B64=$env:M418_B64_SHA256; Xz=$env:M418_XZ_SHA256; Patch=$env:M418_PATCH_SHA256},
            @{Name='m419'; Compact=([IO.File]::ReadAllText((Resolve-Path m419-delta/engine.patch.xz.b64))) -replace '\s',''; B64=$env:M419_B64_SHA256; Xz=$env:M419_XZ_SHA256; Patch=$env:M419_PATCH_SHA256},
            @{Name='m420'; Compact=([IO.File]::ReadAllText((Resolve-Path m420-delta/engine.patch.xz.b64))) -replace '\s',''; B64=$env:M420_B64_SHA256; Xz=$env:M420_XZ_SHA256; Patch=$env:M420_PATCH_SHA256},
            @{Name='m421'; Compact=([IO.File]::ReadAllText((Resolve-Path m421-delta/engine.patch.xz.b64))) -replace '\s',''; B64=$env:M421_B64_SHA256; Xz=$env:M421_XZ_SHA256; Patch=$env:M421_PATCH_SHA256}
          )
          foreach ($item in $items) {
            [IO.File]::WriteAllText("$($item.Name).patch.xz.b64", $item.Compact, [Text.Encoding]::ASCII)
            $b64=(Get-FileHash "$($item.Name).patch.xz.b64" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($b64 -ne $item.B64) { throw "$($item.Name) base64 checksum mismatch: $b64" }
            [IO.File]::WriteAllBytes("$($item.Name).patch.xz", [Convert]::FromBase64String($item.Compact))
            $xz=(Get-FileHash "$($item.Name).patch.xz" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($xz -ne $item.Xz) { throw "$($item.Name) XZ checksum mismatch: $xz" }
          }
          @'
          import hashlib,lzma
          from pathlib import Path
          expected={
            'm417':'930647d0fd18912203c0dda3b028f950134830e84925c01700c65f48d40e41c0',
            'm418':'788da95b1e4310ce270fd0553b02fb9e14e5b6668c40764b5dd4bff03fe434ae',
            'm419':'f6302f64d6d62800bdba755d69e892c089c03a166d5809d2634361ef32bc3466',
            'm420':'2213bb54f52600439ad393db4e9448764db3c3441c2a8dc109fc4e51e7bc909b',
            'm421':'3bec87a11f56f29a263afc270090e31136fce566f79a700c50a93ad76da66046',
          }
          for name,want in expected.items():
              patch=lzma.decompress(Path(name+'.patch.xz').read_bytes())
              got=hashlib.sha256(patch).hexdigest()
              if got!=want: raise SystemExit(f'{name} patch checksum mismatch: {got}')
              Path(name+'.patch').write_bytes(patch)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Patch decompression failed.' }

          git clone https://github.com/TheForceEngine/TheForceEngine.git tfe
          git -C tfe checkout $env:TFE_SHA
          foreach ($patch in @('m417.patch','m418.patch','m419.patch','m420.patch','m421.patch')) {
            git -C tfe apply --check (Resolve-Path $patch)
            git -C tfe apply (Resolve-Path $patch)
          }
          git -C tfe diff --check

          $main=Get-Content tfe\TheForceEngine\main.cpp -Raw
          $coop=Get-Content tfe\TheForceEngine\TFE_DarkForces\Coop\coop.cpp -Raw
          $df=Get-Content tfe\TheForceEngine\TFE_DarkForces\darkForcesMain.cpp -Raw
          foreach ($needle in @('coop-wait-for-peer','mute-music','campaignPeerReady','frame < 600u','STORMFIN.WAX')) {
            if (($main+$coop+$df) -notmatch [regex]::Escape($needle)) { throw "Missing M4.2.1 marker: $needle" }
          }

      - name: Force static native MSVC runtime
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          project=Path('tfe/TheForceEngine/TheForceEngine.vcxproj')
          text=project.read_text(encoding='utf-8-sig')
          marker="  <ItemDefinitionGroup Condition=\"'$(Configuration)|$(Platform)'=='Release|x64'\">\n    <ClCompile>\n"
          if marker not in text: raise SystemExit('Release x64 ClCompile block not found')
          if '<RuntimeLibrary>MultiThreaded</RuntimeLibrary>' not in text:
              text=text.replace(marker, marker+'      <RuntimeLibrary>MultiThreaded</RuntimeLibrary>\n', 1)
          project.write_text(text, encoding='utf-8-sig', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set static MSVC runtime.' }

      - name: Build Windows x64 with MSVC
        shell: pwsh
        run: |
          msbuild tfe\TheForceEngine.sln /m /restore /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE." }

      - name: Collect, inspect, and loader-smoke-test package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem tfe -Recurse -Filter *.exe | Where-Object {$_.Name -match '^TheForceEngine\.exe$|^theforceengine\.exe$' -and $_.FullName -match '\\Release\\'} | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'The Force Engine executable was not found.' }
          $pdb=Get-ChildItem tfe -Recurse -Filter *.pdb | Where-Object {$_.Name -match '^TheForceEngine\.pdb$|^theforceengine\.pdb$' -and $_.FullName -match '\\Release\\'} | Sort-Object Length -Descending | Select-Object -First 1

          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $exe.FullName artifact\theforceengine.exe
          if ($pdb) { Copy-Item $pdb.FullName artifact\theforceengine.pdb }
          foreach ($dll in @('SDL2.dll','SDL2_image.dll','ogg.dll','theora.dll','vorbis.dll')) {
            $source=Join-Path 'tfe\TheForceEngine' $dll
            if (-not (Test-Path $source -PathType Leaf)) { throw "Missing runtime DLL: $dll" }
            Copy-Item $source artifact\$dll
          }
          Copy-Item m417.patch artifact\TFE-Coop-Milestone-4.1.7-Base.patch
          Copy-Item m418.patch artifact\TFE-Coop-Milestone-4.1.8-Delta.patch
          Copy-Item m419.patch artifact\TFE-Coop-Milestone-4.1.9-Engine-Delta.patch
          Copy-Item m420.patch artifact\TFE-Coop-Milestone-4.2.0-Engine-Delta.patch
          Copy-Item m421.patch artifact\TFE-Coop-Milestone-4.2.1-Engine-Delta.patch
          Copy-Item tfe\LICENSE artifact\LICENSE

          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual Studio C++ toolchain not found.' }
          $vcvars=Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $redistRoot=Join-Path $vs 'VC\Redist\MSVC'
          $runtime=Get-ChildItem $redistRoot -Recurse -Filter VCRUNTIME140.dll -File | Where-Object {$_.FullName -match '\\x64\\Microsoft\.VC\d+\.CRT\\VCRUNTIME140\.dll$' -and $_.FullName -notmatch '\\onecore\\'} | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $runtime) { throw 'Signed x64 VCRUNTIME140.dll not found.' }
          $sig=Get-AuthenticodeSignature $runtime.FullName
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'VCRUNTIME140.dll signature validation failed.' }
          Copy-Item $runtime.FullName artifact\VCRUNTIME140.dll
          @("Source: $($runtime.FullName)","SHA-256: $((Get-FileHash $runtime.FullName -Algorithm SHA256).Hash.ToLowerInvariant())","Signature status: $($sig.Status)","Signer: $($sig.SignerCertificate.Subject)") | Set-Content artifact\VCRUNTIME140-PROVENANCE.txt -Encoding UTF8

          $cmd='call "'+$vcvars+'" && dumpbin.exe /headers artifact\theforceengine.exe > artifact\PE-HEADERS.txt && dumpbin.exe /dependents artifact\theforceengine.exe > artifact\DEPENDENCIES.txt'
          & cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin validation failed.' }
          $deps=Get-Content artifact\DEPENDENCIES.txt -Raw
          foreach ($forbidden in @('libunwind.dll','libc++.dll','VCRUNTIME140.dll','MSVCP140.dll')) {
            if ($deps -match [regex]::Escape($forbidden)) { throw "Forbidden direct dependency: $forbidden" }
          }
          if ((Get-Content artifact\PE-HEADERS.txt -Raw) -notmatch 'machine \(x64\)') { throw 'Executable is not x64.' }

          Push-Location artifact
          try {
            $smoke=Start-Process .\theforceengine.exe -ArgumentList '--help' -PassThru
            Start-Sleep -Seconds 3
            if (-not $smoke.HasExited) { Stop-Process -Id $smoke.Id -Force; $smoke.WaitForExit() }
          } catch { throw "Windows loader smoke test failed: $($_.Exception.Message)" }
          finally { Pop-Location }

          Get-FileHash artifact\* -Algorithm SHA256 | Sort-Object Path | ForEach-Object {"{0}  {1}" -f $_.Hash.ToLowerInvariant(),[IO.Path]::GetFileName($_.Path)} | Set-Content artifact\SHA256SUMS.txt -Encoding Ascii
          Get-Content artifact\DEPENDENCIES.txt
          Get-Content artifact\SHA256SUMS.txt

      - name: Upload native Milestone 4.2.1 engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: TFE-Coop-Milestone-4.2.1-MSVC-x64-self-contained
          path: artifact/
          if-no-files-found: error
          retention-days: 7
