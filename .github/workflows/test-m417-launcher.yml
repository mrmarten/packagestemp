name: Test exact TFE Co-op M4.1.7 launcher

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Decode and checksum the exact scripts
        shell: pwsh
        run: |
          $launcherEncoded = (Get-Content m417-launcher/Start-TFE-Coop-Local.ps1.xz.b64 -Raw) -replace '\s',''
          $verifierEncoded = (Get-Content m417-launcher/VERIFY-WINDOWS.ps1.xz.b64 -Raw) -replace '\s',''
          [IO.File]::WriteAllBytes('launcher.xz', [Convert]::FromBase64String($launcherEncoded))
          [IO.File]::WriteAllBytes('verifier.xz', [Convert]::FromBase64String($verifierEncoded))
          @'
          import hashlib, lzma
          from pathlib import Path
          items = [
              ('launcher.xz', 'Start-TFE-Coop-Local.ps1', 'eb0afd104463d3e5e5fa88d4396088f0bd170960eb37f16d031e6ade1382c278'),
              ('verifier.xz', 'VERIFY-WINDOWS.ps1', '03768bf3bb3703f60ff496bf7dc60fe820ec9363aa8b46d5477f691658cf0382'),
          ]
          for compressed_name, output_name, expected in items:
              source = lzma.decompress(Path(compressed_name).read_bytes())
              actual = hashlib.sha256(source).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{output_name} checksum mismatch: {actual}')
              Path(output_name).write_bytes(source)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Script decode/checksum failed.' }
          New-Item -ItemType File -Path .\theforceengine.exe -Force | Out-Null

      - name: Parse exact launcher and verifier with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($script in @('.\Start-TFE-Coop-Local.ps1','.\VERIFY-WINDOWS.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List -Force
              throw "Windows PowerShell 5.1 parser reported errors in $script."
            }
          }
          $text = Get-Content .\Start-TFE-Coop-Local.ps1 -Raw
          foreach ($forbidden in @('$controllerProfile:', '$splitExe', 'Static MSVC supervisor active')) {
            if ($text.Contains($forbidden)) { throw "Forbidden launcher regression remains: $forbidden" }
          }
          foreach ($required in @('${controllerProfile}:','Assert-ProcessAlive','Wait-ForMainWindowHandle','[IntPtr]::Zero','Start-Process -FilePath $engineExe')) {
            if (-not $text.Contains($required)) { throw "Required launcher safeguard is absent: $required" }
          }
          Write-Host 'Windows PowerShell 5.1 parsing: PASS'

      - name: Execute every non-launching geometry and input preflight
        shell: powershell
        run: |
          foreach ($layout in @('Vertical','Horizontal')) {
            foreach ($mode in @('KeyboardController','ControllerKeyboard','TwoControllers')) {
              $output = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
                -File .\Start-TFE-Coop-Local.ps1 -Layout $layout -InputMode $mode -PreflightOnly 2>&1
              if ($LASTEXITCODE -ne 0) {
                $output | ForEach-Object { Write-Host $_ }
                throw "Preflight failed: $layout / $mode"
              }
              $json = $output | Where-Object { "$_" -match '^\{.*\}$' } | Select-Object -Last 1
              if (-not $json) { throw "No preflight JSON: $layout / $mode" }
              $data = $json | ConvertFrom-Json
              foreach ($field in @('WorkArea','HostRectangle','ClientRectangle')) {
                if ($data.$field -notmatch '^-?\d+,-?\d+,\d+,\d+$') {
                  throw "Invalid $field for $layout / ${mode}: $($data.$field)"
                }
              }
              if ($data.HostArguments -notmatch '--coop-host') { throw 'Host arguments lack --coop-host.' }
              if ($data.ClientArguments -notmatch '--coop-connect 127\.0\.0\.1') { throw 'Client arguments lack localhost connection.' }
              if ($mode -eq 'KeyboardController' -and ([int]$data.HostController -ne 31 -or [int]$data.ClientController -ne 0)) {
                throw 'Keyboard/controller assignment is wrong.'
              }
            }
          }
          Write-Host 'All layout/input preflight paths: PASS'
