name: Decode TFE M4 hotfix patch

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  B64_SHA256: 5776428a7e95b65fe6f1e6b07de20804b52fdca392ed101e11f634c850315ebf
  XZ_SHA256: 90153819419367b0370692b3f5baa248589c4014028735443be44d14c3b5cb73
  PATCH_SHA256: 30bef404bff1fac4cab737a71e33760888fcfd959b6a19a40588a39c72123951

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct compressed patch
        shell: bash
        run: |
          set -euo pipefail
          cat patches/m4-hotfix-v2/part-*.txt > m4-hotfix.patch.xz.b64
          test "$(sha256sum m4-hotfix.patch.xz.b64 | awk '{print $1}')" = "$B64_SHA256"
          base64 --decode m4-hotfix.patch.xz.b64 > m4-hotfix.patch.xz
          test "$(sha256sum m4-hotfix.patch.xz | awk '{print $1}')" = "$XZ_SHA256"
          xz -t m4-hotfix.patch.xz
          xz --decompress --stdout m4-hotfix.patch.xz > m4-hotfix.patch
          test "$(sha256sum m4-hotfix.patch | awk '{print $1}')" = "$PATCH_SHA256"
          sha256sum m4-hotfix.patch.xz.b64 m4-hotfix.patch.xz m4-hotfix.patch > SHA256SUMS.txt
          head -60 m4-hotfix.patch
      - uses: actions/upload-artifact@v4
        with:
          name: decoded-m4-hotfix-patch
          path: |
            m4-hotfix.patch
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
