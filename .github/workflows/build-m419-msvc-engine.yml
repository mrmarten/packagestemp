name: Build TFE Co-op M4.1.9 native MSVC engine

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TFE_SHA: 54eab324e9b265c503b51c3690f030f42a0f9fcc
  M417_B64_SHA256: f2a7eec673a104572bc8d5f70aabdf872b4581a36c5b89ddd8688e810b12d458
  M417_XZ_SHA256: 95995772a116923b9c26773c1a97468ce931f6b9240a3a3a21bd8ef7283c11dd
  M417_PATCH_SHA256: 930647d0fd18912203c0dda3b028f950134830e84925c01700c65f48d40e41c0
  M418_B64_SHA256: 89a777082a42c8d1881dda2148025d37129bebf0b2030f2159c576fc02c78bf6
  M418_XZ_SHA256: 938d3cb1441f33b71b297c50d7a2bfdc14dc1b9a67c99f086ea43d79fee3db1f
  M418_PATCH_SHA256: 788da95b1e4310ce270fd0553b02fb9e14e5b6668c40764b5dd4bff03fe434ae
  M419_B64_SHA256: 3bfbecf0a4883fa44f64823dcb86eadfc8299c2b6b5523aa00e313ad0c459b0a
  M419_XZ_SHA256: ddeb4959895c7dc722e07aca889930227371b6e077647a2c0c286a076a8a0652
  M419_PATCH_SHA256: f6302f64d6d62800bdba755d69e892c089c03a166d5809d2634361ef32bc3466

jobs:
  protocol-and-regression-tests:
    name: Protocol tests, sanitizers, and VUE serialization regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct patched source
        shell: bash
        run: |
          set -euo pipefail
          cat m417-patch/part-*.txt | tr -d '[:space:]' > m417.patch.xz.b64
          printf '%s' "$(tr -d '[:space:]' < m418-delta/part-00.txt)" > m418.patch.xz.b64
          printf '%s' "$(tr -d '[:space:]' < m419-delta/engine.patch.xz.b64)" > m419.patch.xz.b64
          echo "${M417_B64_SHA256}  m417.patch.xz.b64" | sha256sum -c -
          echo "${M418_B64_SHA256}  m418.patch.xz.b64" | sha256sum -c -
          echo "${M419_B64_SHA256}  m419.patch.xz.b64" | sha256sum -c -
          base64 -d m417.patch.xz.b64 > m417.patch.xz
          base64 -d m418.patch.xz.b64 > m418.patch.xz
          base64 -d m419.patch.xz.b64 > m419.patch.xz
          echo "${M417_XZ_SHA256}  m417.patch.xz" | sha256sum -c -
          echo "${M418_XZ_SHA256}  m418.patch.xz" | sha256sum -c -
          echo "${M419_XZ_SHA256}  m419.patch.xz" | sha256sum -c -
          xz -dc m417.patch.xz > m417.patch
          xz -dc m418.patch.xz > m418.patch
          xz -dc m419.patch.xz > m419.patch
          echo "${M417_PATCH_SHA256}  m417.patch" | sha256sum -c -
          echo "${M418_PATCH_SHA256}  m418.patch" | sha256sum -c -
          echo "${M419_PATCH_SHA256}  m419.patch" | sha256sum -c -

          git clone --depth 1 https://github.com/TheForceEngine/TheForceEngine.git tfe
          git -C tfe fetch --depth 1 origin "${TFE_SHA}"
          git -C tfe checkout "${TFE_SHA}"
          git -C tfe apply m417.patch
          git -C tfe apply m418.patch
          git -C tfe apply m419.patch
          git -C tfe diff --check

          # Exact source guards for the crash in the uploaded dump: the Host
          # captured a migration snapshot before a VUE task had run, leaving
          # stackPtr[0] null and causing memcpy to read from address 0x8.
          python3 - <<'PY'
          from pathlib import Path
          task = Path('tfe/TheForceEngine/TFE_Jedi/Task/task.cpp').read_text()
          task_h = Path('tfe/TheForceEngine/TFE_Jedi/Task/task.h').read_text()
          vue = Path('tfe/TheForceEngine/TFE_DarkForces/vueLogic.cpp').read_text()
          required = {
              'task signature carries local size': 'u32 localMemSize = 0' in task_h,
              'pre-run local context allocation': 'modeWrite && localMemCallback && localMemSize && !task->context.stackPtr[0]' in task,
              'allocation precedes stack-size serialization': task.index('modeWrite && localMemCallback') < task.index('SERIALIZE(SaveVersionInit, task->context.stackSize[0]'),
              'full task stack is zeroed on load': 'memset(task->context.stackMem, 0, TASK_STACK_SIZE)' in task,
              'vue call declares LocalContext size': 'false, sizeof(LocalContext)' in vue,
              'vue serializer handles null/uninitialized context': 'LocalContext fallback = { 0 }' in vue and 'modeWrite && !locals->vue' in vue,
              'vue object pointer is guarded': 'if (modeWrite && locals->obj)' in vue,
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit('VUE serialization regression guard failed: ' + ', '.join(failed))
          print('VUE pre-run task serialization regression guards: PASS')
          PY

      - name: Run protocol and session tests
        shell: bash
        run: |
          set -euo pipefail
          cd tfe
          ./tests/coop/build_and_run.sh

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        shell: bash
        env:
          COOP_SANITIZE: '1'
          COOP_TEST_BUILD_DIR: build/coop-tests-sanitized
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cd tfe
          ./tests/coop/build_and_run.sh

      - name: Validate campaign-certifier fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd tfe
          python3 Tools/CoopCertification/coop_campaign_certify.py --self-test

  windows:
    name: Native MSVC x64 engine with Host snapshot crash fix
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Reconstruct and apply Milestones 4.1.7, 4.1.8, and 4.1.9
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $parts = Get-ChildItem m417-patch/part-*.txt | Sort-Object Name
          if ($parts.Count -ne 12) { throw "Expected 12 Milestone 4.1.7 patch chunks, found $($parts.Count)." }
          $items = @(
            @{ Name='m417'; Compact=(($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName) }) -join '') -replace '\s',''; B64=$env:M417_B64_SHA256; Xz=$env:M417_XZ_SHA256; Patch=$env:M417_PATCH_SHA256 },
            @{ Name='m418'; Compact=([IO.File]::ReadAllText((Resolve-Path m418-delta/part-00.txt))) -replace '\s',''; B64=$env:M418_B64_SHA256; Xz=$env:M418_XZ_SHA256; Patch=$env:M418_PATCH_SHA256 },
            @{ Name='m419'; Compact=([IO.File]::ReadAllText((Resolve-Path m419-delta/engine.patch.xz.b64))) -replace '\s',''; B64=$env:M419_B64_SHA256; Xz=$env:M419_XZ_SHA256; Patch=$env:M419_PATCH_SHA256 }
          )
          foreach ($item in $items) {
            [IO.File]::WriteAllText("$($item.Name).patch.xz.b64", $item.Compact, [Text.Encoding]::ASCII)
            $b64Hash=(Get-FileHash "$($item.Name).patch.xz.b64" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($b64Hash -ne $item.B64) { throw "$($item.Name) base64 checksum mismatch: $b64Hash" }
            [IO.File]::WriteAllBytes("$($item.Name).patch.xz", [Convert]::FromBase64String($item.Compact))
            $xzHash=(Get-FileHash "$($item.Name).patch.xz" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($xzHash -ne $item.Xz) { throw "$($item.Name) XZ checksum mismatch: $xzHash" }
          }

          @'
          import hashlib,lzma
          from pathlib import Path
          items=[
            ('m417','930647d0fd18912203c0dda3b028f950134830e84925c01700c65f48d40e41c0'),
            ('m418','788da95b1e4310ce270fd0553b02fb9e14e5b6668c40764b5dd4bff03fe434ae'),
            ('m419','f6302f64d6d62800bdba755d69e892c089c03a166d5809d2634361ef32bc3466'),
          ]
          for name,expected in items:
              patch=lzma.decompress(Path(name+'.patch.xz').read_bytes())
              actual=hashlib.sha256(patch).hexdigest()
              if actual!=expected: raise SystemExit(f'{name} patch checksum mismatch: {actual}')
              Path(name+'.patch').write_bytes(patch)
              print(name, len(patch), actual)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Patch decompression failed.' }

          git clone https://github.com/TheForceEngine/TheForceEngine.git tfe
          git -C tfe checkout $env:TFE_SHA
          foreach ($patch in @('m417.patch','m418.patch','m419.patch')) {
            git -C tfe apply --check (Resolve-Path $patch)
            git -C tfe apply (Resolve-Path $patch)
          }
          git -C tfe diff --check

          $task=Get-Content tfe\TheForceEngine\TFE_Jedi\Task\task.cpp -Raw
          $vue=Get-Content tfe\TheForceEngine\TFE_DarkForces\vueLogic.cpp -Raw
          foreach ($needle in @(
            'modeWrite && localMemCallback && localMemSize && !task->context.stackPtr[0]',
            'memset(task->context.stackMem, 0, TASK_STACK_SIZE)',
            'false, sizeof(LocalContext)',
            'if (modeWrite && locals->obj)'
          )) {
            if (($task + $vue) -notmatch [regex]::Escape($needle)) { throw "Missing 4.1.9 crash-fix marker: $needle" }
          }

      - name: Force static native MSVC runtime
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          project=Path('tfe/TheForceEngine/TheForceEngine.vcxproj')
          text=project.read_text(encoding='utf-8-sig')
          marker="  <ItemDefinitionGroup Condition=\"'$(Configuration)|$(Platform)'=='Release|x64'\">\n    <ClCompile>\n"
          if marker not in text: raise SystemExit('Release x64 ClCompile block not found')
          if '<RuntimeLibrary>MultiThreaded</RuntimeLibrary>' not in text:
              text=text.replace(marker, marker+'      <RuntimeLibrary>MultiThreaded</RuntimeLibrary>\n', 1)
          project.write_text(text,encoding='utf-8-sig',newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set static MSVC runtime.' }

      - name: Build Windows x64 with MSVC
        shell: pwsh
        run: |
          msbuild tfe\TheForceEngine.sln /m /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE." }

      - name: Collect, inspect, and loader-smoke-test the native package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem tfe -Recurse -Filter TheForceEngine.exe | Where-Object FullName -match '\\Release\\' | Sort-Object Length -Descending | Select-Object -First 1
          $pdb=Get-ChildItem tfe -Recurse -Filter TheForceEngine.pdb | Where-Object FullName -match '\\Release\\' | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe -or -not $pdb) { throw 'The Force Engine EXE or PDB was not found after MSBuild.' }

          New-Item artifact -ItemType Directory -Force | Out-Null
          Copy-Item $exe.FullName artifact\theforceengine.exe
          Copy-Item $pdb.FullName artifact\TheForceEngine.pdb
          foreach ($dll in @('SDL2.dll','SDL2_image.dll','ogg.dll','theora.dll','vorbis.dll')) {
            $source=Join-Path 'tfe\TheForceEngine' $dll
            if (-not (Test-Path $source -PathType Leaf)) { throw "Runtime DLL missing: $dll" }
            Copy-Item $source artifact\$dll
          }
          Copy-Item m417.patch artifact\TFE-Coop-Milestone-4.1.7-Base.patch
          Copy-Item m418.patch artifact\TFE-Coop-Milestone-4.1.8-Delta.patch
          Copy-Item m419.patch artifact\TFE-Coop-Milestone-4.1.9-Engine-Delta.patch
          Copy-Item tfe\LICENSE artifact\LICENSE

          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Visual Studio C++ toolchain not found.' }
          $vcvars=Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $redistRoot=Join-Path $vs 'VC\Redist\MSVC'
          $vcRuntime=Get-ChildItem $redistRoot -Recurse -Filter VCRUNTIME140.dll -File |
            Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC\d+\.CRT\\VCRUNTIME140\.dll$' -and $_.FullName -notmatch '\\onecore\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $vcRuntime) { throw 'Signed x64 VCRUNTIME140.dll not found.' }
          $signature=Get-AuthenticodeSignature $vcRuntime.FullName
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'VCRUNTIME140 signature invalid.' }
          Copy-Item $vcRuntime.FullName artifact\VCRUNTIME140.dll
          @(
            "Source: $($vcRuntime.FullName)",
            "SHA-256: $((Get-FileHash $vcRuntime.FullName -Algorithm SHA256).Hash.ToLowerInvariant())",
            "Signature status: $($signature.Status)",
            "Signer: $($signature.SignerCertificate.Subject)"
          ) | Set-Content artifact\VCRUNTIME140-PROVENANCE.txt -Encoding UTF8

          $cmd='call "'+$vcvars+'" && dumpbin.exe /headers artifact\theforceengine.exe > artifact\PE-HEADERS.txt && dumpbin.exe /dependents artifact\theforceengine.exe > artifact\DEPENDENCIES.txt'
          & cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed.' }
          $deps=Get-Content artifact\DEPENDENCIES.txt -Raw
          foreach ($forbidden in @('libunwind.dll','libc++.dll','VCRUNTIME140.dll','MSVCP140.dll')) {
            if ($deps -match [regex]::Escape($forbidden)) { throw "Forbidden direct dependency: $forbidden" }
          }
          if ((Get-Content artifact\PE-HEADERS.txt -Raw) -notmatch 'machine \(x64\)') { throw 'Result is not x64.' }

          Push-Location artifact
          try {
            $smoke=Start-Process .\theforceengine.exe -ArgumentList '--help' -PassThru
            Start-Sleep -Seconds 3
            if (-not $smoke.HasExited) { Stop-Process $smoke.Id -Force; $smoke.WaitForExit() }
          } catch { throw "Windows loader smoke test failed: $($_.Exception.Message)" }
          finally { Pop-Location }

          @(
            'Milestone: 4.1.9',
            "Engine SHA-256: $((Get-FileHash artifact\theforceengine.exe -Algorithm SHA256).Hash.ToLowerInvariant())",
            "PDB SHA-256: $((Get-FileHash artifact\TheForceEngine.pdb -Algorithm SHA256).Hash.ToLowerInvariant())",
            'Fix: allocate and initialize pre-run VUE task local memory before migration/save serialization',
            'Crash signature fixed: read access violation at address 0x8 inside memcpy during Host migration snapshot'
          ) | Set-Content artifact\BUILD-INFO.txt -Encoding UTF8

          Get-ChildItem artifact -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content artifact\SHA256SUMS.txt -Encoding Ascii

      - name: Upload native Milestone 4.1.9 engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: TFE-Coop-Milestone-4.1.9-MSVC-x64-self-contained
          path: artifact/
          if-no-files-found: error
          retention-days: 7
